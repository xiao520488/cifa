<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>词笺 · 三个设计方向</title>
<style>
  :root {
    --ink: #0B0B0B; --paper: #EDEDEA; --muted: #6B6B63; --line: rgba(11,11,11,.18);
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --sans: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  header { padding: 28px 32px 0; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  header p { margin: 6px 0 20px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); padding: 1px; }
  .col { background: var(--paper); display: flex; flex-direction: column; min-width: 0; }
  .col__head { padding: 16px 16px 12px; }
  .col__name { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .col__desc { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .col__links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .col__links a { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    text-decoration: none; color: var(--ink); border: 1px solid var(--line); padding: 5px 8px; border-radius: 0; }
  .col__links a:hover { background: var(--ink); color: #fff; }
  .frame { padding: 0 16px 20px; }
  iframe { width: 100%; height: 760px; border: 1px solid var(--line); background: #fff; display: block; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } iframe { height: 700px; } }
</style>
</head>
<body>
<header>
  <h1>词笺 · 三个设计方向</h1>
  <p>三套互相冲突的排印系统 · 点开箭头看单页大图</p>
</header>
<div class="grid">
  <section class="col">
    <div class="col__head">
      <p class="col__name">A · 铅字 Foundry</p>
      <p class="col__desc">印刷厂硬边：纯黑线、方角、硬投影、印章红只做信号。</p>
      <div class="col__links">
        <a href="a.html?s=start" target="_blank">开始页</a>
        <a href="a.html?s=study" target="_blank">学习中</a>
        <a href="a.html?s=quiz" target="_blank">自测</a>
        <a href="a.html?s=study&t=dark" target="_blank">暗色</a>
      </div>
    </div>
    <div class="frame"><iframe src="a.html?s=study" title="方向 A"></iframe></div>
  </section>
  <section class="col">
    <div class="col__head">
      <p class="col__name">B · 仪表 Instrument</p>
      <p class="col__desc">精密仪器：深色原生、等宽数字、琥珀信号、刻度尺。</p>
      <div class="col__links">
        <a href="b.html?s=start" target="_blank">开始页</a>
        <a href="b.html?s=study" target="_blank">学习中</a>
        <a href="b.html?s=quiz" target="_blank">自测</a>
        <a href="b.html?s=study&t=light" target="_blank">浅色</a>
      </div>
    </div>
    <div class="frame"><iframe src="b.html?s=study" title="方向 B"></iframe></div>
  </section>
  <section class="col">
    <div class="col__head">
      <p class="col__name">C · 词表报 Broadsheet</p>
      <p class="col__desc">编辑部排版：衬线、栏线、刊号、报尾工具条，靛蓝点睛。</p>
      <div class="col__links">
        <a href="c.html?s=start" target="_blank">开始页</a>
        <a href="c.html?s=study" target="_blank">学习中</a>
        <a href="c.html?s=quiz" target="_blank">自测</a>
        <a href="c.html?s=study&t=dark" target="_blank">暗色</a>
      </div>
    </div>
    <div class="frame"><iframe src="c.html?s=study" title="方向 C"></iframe></div>
  </section>
</div>
</body>
</html>
