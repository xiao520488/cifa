<!doctype html>
<!--
  方向 B / 仪表 Instrument
  气质：精密测量仪器与专业电子词典，冷静、克制、读数优先。
  三条设计规则：
  1. 层级只靠字号、字重、墨色与 1px 线，不靠阴影、卡片和底色堆叠。
  2. 所有数字、音标、标签、按钮读数统一使用等宽字，建立可比较的刻度感。
  3. 琥珀色只做信号：当前批次、激活通道、偷看扫描线；面积不超过 10%。
  明确禁区：禁止反相式暗色、渐变光晕、玻璃拟态、阴影、emoji、胶囊按钮与装饰性假图标。
  关键令牌（浅色 / 深色）：
  --bg            #F1F2F4 / #0B0D0F
  --surface       #FFFFFF / #12151A
  --surface-2     #E9ECEF / #171B21
  --border        #D6DAE0 / #20252C
  --border-strong #B4BBC4 / #2A3038
  --text          #0C1013 / #E6E8EB
  --text-muted    #5A626B / #98A0A9
  --text-faint    #626A73 / #7C858E（为满足 12px 音标 4.5:1，暗色由 #6B737C 提亮、浅色压深）
  --accent        #FFB020 / #FFB020（只做非文字块）
  --accent-ink    #A35A00 / #FFB020（琥珀文字）
  --mask          #C9CFD6 / #1E2228
  字体：IBM Plex Sans 600 用于词头；IBM Plex Mono 用于数字、音标、标签、按钮；中文走系统 sans。
-->
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FFB020'/%3E%3C/svg%3E">
  <title>词笺 · 仪表</title>
  <script>
    (function () {
      try {
        var theme = new URLSearchParams(window.location.search).get('t');
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      } catch (error) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light;

      --font-sans: "IBM Plex Sans", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, monospace;
      --font-cn: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;

      --bg: #F1F2F4;
      --surface: #FFFFFF;
      --surface-2: #E9ECEF;
      --border: #D6DAE0;
      --border-strong: #B4BBC4;
      --text: #0C1013;
      --text-body: #2A3038;
      --text-muted: #5A626B;
      --text-faint: #626A73;
      --text-disabled: rgba(12, 16, 19, 0.3);
      --accent: #FFB020;
      --accent-ink: #A35A00;
      --accent-soft: rgba(255, 176, 32, 0.16);
      --accent-press: #8F4E00;
      --accent-on: #FFFFFF;
      --mask: #C9CFD6;
      --focus: #A35A00;
      --clear: transparent;

      --radius-xs: 2px;
      --radius-sm: 3px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
      --space-9: 48px;
      --space-10: 56px;
      --space-11: 64px;
      --space-12: 80px;

      --fs-micro: 9px;
      --fs-label: 10px;
      --fs-meta: 11px;
      --fs-phon: 12px;
      --fs-value: 13px;
      --fs-body: 15px;
      --fs-readout: 15px;
      --fs-button: 15px;
      --fs-nav: 16px;
      --fs-index: 10px;
      --fs-pos: 9px;
      --fs-mask: 11px;
      --fs-word: clamp(26px, 7.2vw, 34px);
      --fs-title: clamp(32px, 5.2vw, 44px);
      --fs-title-sub: clamp(20px, 3.2vw, 26px);

      --lh-title: 1.06;
      --lh-word: 1.12;
      --lh-body: 1.55;
      --lh-ui: 1.2;
      --lh-tight: 1.1;

      --ls-tight: -0.03em;
      --ls-word: -0.012em;
      --ls-hud: 0.12em;
      --ls-label: 0.14em;
      --ls-caps: 0.08em;
      --ls-micro: 0.06em;
      --ls-num: 0.02em;
      --ls-none: 0;

      --gutter: 20px;
      --col-max: 680px;
      --bar-max: 680px;
      --target-min: 44px;
      --button-h: 56px;
      --control-h: 58px;
      --cta-min: 236px;
      --mark-size: 12px;
      --idx-w: 20px;
      --idx-tick-h: 16px;
      --wordline-min: 32px;
      --mask-h: 20px;
      --dot-step: 8px;
      --tick-step: 8px;
      --tick-h: 3px;
      --tick-area: 6px;
      --ruler-h: 3px;
      --ruler-gap: 3px;
      --ruler-past: 1px;
      --rule-accent: 3px;
      --focus-w: 2px;
      --focus-offset: 2px;
      --scan-w: 1px;
      --space-row: 14px;
      --start-pad: var(--space-4);
      --bar-clearance: 96px;

      --dur-fast: 140ms;
      --dur-reveal: 320ms;
      --dur-theme: 200ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
      --ease-press: cubic-bezier(0.2, 0.7, 0.3, 1);

      --z-bar: 20;
      --z-skip: 30;
    }

    [data-theme="dark"] {
      color-scheme: dark;

      --bg: #0B0D0F;
      --surface: #12151A;
      --surface-2: #171B21;
      --border: #20252C;
      --border-strong: #2A3038;
      --text: #E6E8EB;
      --text-body: #C8CED5;
      --text-muted: #98A0A9;
      --text-faint: #7C858E;
      --text-disabled: rgba(230, 232, 235, 0.3);
      --accent: #FFB020;
      --accent-ink: #FFB020;
      --accent-soft: rgba(255, 176, 32, 0.12);
      --accent-press: #D89416;
      --accent-on: #0B0D0F;
      --mask: #1E2228;
      --focus: #FFB020;
    }

    @font-face {
      font-family: "IBM Plex Sans";
      src: url("./fonts/ibm-plex-sans-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("./fonts/ibm-plex-sans-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("./fonts/ibm-plex-sans-600-normal.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("./fonts/ibm-plex-mono-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("./fonts/ibm-plex-mono-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("./fonts/ibm-plex-mono-600-normal.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-padding-bottom: calc(var(--bar-clearance) + env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      padding-bottom: calc(var(--bar-clearance) + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color var(--dur-theme) var(--ease-out), color var(--dur-theme) var(--ease-out);
    }

    body[data-screen="start"] {
      padding-bottom: 0;
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--text);
    }

    button,
    a {
      -webkit-tap-highlight-color: var(--accent-soft);
    }

    button {
      font: inherit;
    }

    h1,
    h2,
    p,
    ol,
    ul {
      margin: 0;
    }

    :where(button, a, [tabindex]):focus-visible {
      outline: var(--focus-w) solid var(--focus);
      outline-offset: var(--focus-offset);
    }

    .shell {
      width: min(calc(100% - var(--gutter) * 2), var(--col-max));
      margin-inline: auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .skip-link {
      position: fixed;
      top: var(--space-2);
      left: var(--space-2);
      z-index: var(--z-skip);
      display: inline-flex;
      align-items: center;
      min-height: var(--target-min);
      padding: 0 var(--space-4);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xs);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      letter-spacing: var(--ls-caps);
      text-decoration: none;
      transform: translateY(calc(-100% - var(--space-4)));
    }

    .skip-link:focus-visible {
      transform: translateY(0);
    }

    /* HUD */
    .hud {
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .hud-inner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
      padding-top: var(--space-5);
      padding-bottom: var(--space-3);
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      min-width: 0;
    }

    .brand-mark {
      width: var(--mark-size);
      height: var(--mark-size);
      flex: none;
      margin-top: var(--space-1);
      background: var(--accent);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-line {
      display: flex;
      align-items: baseline;
      gap: var(--space-2);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--fs-meta);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-hud);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-name {
      color: var(--text);
      font-weight: 600;
      letter-spacing: var(--ls-micro);
    }

    .brand-rule {
      color: var(--text-faint);
      letter-spacing: var(--ls-none);
    }

    .brand-stage {
      color: var(--text-muted);
    }

    .brand-sub {
      display: none;
      margin-top: var(--space-1);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-label);
      text-transform: uppercase;
      white-space: nowrap;
    }

    body[data-screen="start"] .brand-sub {
      display: block;
    }

    .issue {
      display: flex;
      align-items: baseline;
      gap: var(--space-3);
      flex: none;
      font-family: var(--font-mono);
      font-size: var(--fs-meta);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-hud);
      font-variant-numeric: tabular-nums slashed-zero;
      white-space: nowrap;
    }

    .issue-no {
      color: var(--text-faint);
    }

    .issue-batch {
      color: var(--text);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .hud-metrics {
      margin-top: var(--space-4);
    }

    body[data-screen="start"] .hud-metrics,
    body[data-screen="start"] .hud-progress {
      display: none;
    }

    .metric {
      min-width: 0;
      padding-top: var(--space-2);
      border-top: 1px solid var(--border);
    }

    .metric-label,
    .channel-label {
      display: block;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-label);
      text-transform: uppercase;
    }

    .metric-value {
      display: flex;
      align-items: baseline;
      gap: 1px;
      margin-top: var(--space-1);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--fs-readout);
      font-weight: 600;
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-num);
      font-variant-numeric: tabular-nums slashed-zero;
      white-space: nowrap;
    }

    .metric-slash {
      color: var(--text-faint);
      font-weight: 400;
    }

    .hud-progress {
      margin-top: var(--space-3);
      padding-bottom: var(--space-3);
    }

    .progress-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-2);
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-label);
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .ruler {
      display: flex;
      gap: var(--ruler-gap);
      width: 100%;
      height: var(--ruler-h);
    }

    .ruler-seg {
      position: relative;
      flex: 1 1 0;
      height: var(--ruler-h);
      background: var(--border);
    }

    .ruler-seg.is-past::before {
      position: absolute;
      inset: 0 0 auto 0;
      height: var(--ruler-past);
      background: var(--accent);
      content: "";
    }

    .ruler-seg.is-current {
      background: var(--accent);
    }

    /* Shared labels */
    .num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums slashed-zero;
      letter-spacing: var(--ls-none);
    }

    /* Start screen */
    .start {
      display: flex;
      flex-direction: column;
      min-height: calc(100svh - var(--space-12));
    }

    .start-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding-top: var(--start-pad);
      padding-bottom: var(--space-6);
    }

    .start-metrics,
    .last-run {
      width: 100%;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-6);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-label);
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: var(--space-3);
      height: 1px;
      flex: none;
      background: var(--accent);
      content: "";
    }

    .start-title {
      max-width: 13ch;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--fs-title);
      font-weight: 600;
      line-height: var(--lh-title);
      letter-spacing: var(--ls-tight);
    }

    .title-line {
      display: block;
    }

    .title-sub {
      display: block;
      margin-top: var(--space-2);
      color: var(--text-muted);
      font-size: var(--fs-title-sub);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-none);
    }

    .start-metrics {
      margin-top: var(--space-8);
    }

    .last-run {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
      margin-top: var(--space-5);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--border);
    }

    .last-label {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-caps);
    }

    .last-value {
      display: flex;
      align-items: baseline;
      gap: var(--space-1);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--fs-value);
      font-weight: 600;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-num);
      font-variant-numeric: tabular-nums slashed-zero;
    }

    .last-slash {
      color: var(--text-faint);
      font-weight: 400;
    }

    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-8);
      min-width: var(--cta-min);
      min-height: var(--button-h);
      margin-top: var(--space-7);
      padding: 0 var(--space-6);
      border: 1px solid var(--accent);
      border-bottom: var(--rule-accent) solid var(--accent-press);
      border-radius: var(--radius-xs);
      background: var(--accent);
      color: var(--accent-on);
      font-family: var(--font-mono);
      font-size: var(--fs-button);
      font-weight: 600;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-none);
      text-decoration: none;
      cursor: pointer;
      transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-press);
    }

    .primary-arrow {
      font-family: var(--font-mono);
      font-size: var(--fs-nav);
      font-weight: 400;
      line-height: 1;
    }

    .primary:hover {
      background: var(--accent-press);
      border-color: var(--accent-press);
    }

    .primary:active {
      transform: translateY(1px);
    }

    [data-theme="light"] .primary {
      border-color: var(--border-strong);
      border-bottom: var(--rule-accent) solid var(--accent);
      background: var(--surface);
      color: var(--accent-ink);
    }

    [data-theme="light"] .primary:hover {
      background: var(--surface-2);
      border-color: var(--border-strong);
      border-bottom-color: var(--accent);
    }

    .boot-foot {
      padding-top: var(--space-8);
      padding-bottom: var(--space-6);
    }

    .tick-rail {
      height: var(--tick-area);
      border-top: 1px solid var(--border);
      background-image: linear-gradient(to right, var(--border) 0 1px, var(--clear) 1px);
      background-repeat: repeat-x;
      background-position: left top;
      background-size: var(--tick-step) var(--tick-h);
    }

    .footline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-4);
      margin-top: var(--space-2);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-caps);
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    /* Study / quiz */
    .study {
      padding-top: var(--space-5);
    }

    .study-status {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-2);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-label);
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .study-mode {
      color: var(--text);
      white-space: nowrap;
    }

    .study-hint {
      margin: 0 0 var(--space-2);
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-label);
    }

    .list-end {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-top: var(--space-5);
      padding-top: var(--space-2);
      border-top: 1px solid var(--border);
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-label);
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .word-list {
      list-style: none;
      padding: 0;
      border-top: 1px solid var(--border);
    }

    .word-row {
      display: grid;
      grid-template-columns: var(--idx-w) minmax(0, 1fr);
      column-gap: var(--space-3);
      position: relative;
      padding: var(--space-row) 0;
      border-bottom: 1px solid var(--border);
    }

    .word-row:focus-visible {
      outline-offset: calc(var(--focus-w) * -1);
    }

    .index {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: var(--space-1);
    }

    .idx-num {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-index);
      font-weight: 500;
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-caps);
      font-variant-numeric: tabular-nums slashed-zero;
    }

    .idx-tick {
      width: 1px;
      height: var(--idx-tick-h);
      margin-top: var(--space-2);
      background: var(--border-strong);
    }

    .word-row.is-current .idx-num {
      color: var(--text);
    }

    .word-row.is-current .idx-tick {
      background: var(--text-faint);
    }

    .word-row.is-revealed .idx-num,
    .word-row.is-peeked .idx-num {
      color: var(--accent-ink);
    }

    .word-row.is-revealed .idx-tick,
    .word-row.is-peeked .idx-tick {
      background: var(--accent);
    }

    .entry {
      min-width: 0;
    }

    .wordline {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: var(--space-3);
      row-gap: var(--space-1);
      min-height: var(--wordline-min);
    }

    .word {
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--fs-word);
      font-weight: 600;
      line-height: var(--lh-word);
      letter-spacing: var(--ls-word);
      overflow-wrap: break-word;
    }

    .phon {
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: var(--fs-phon);
      font-weight: 400;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-none);
      white-space: nowrap;
    }

    .peek-flag {
      align-self: center;
      padding-bottom: 1px;
      border-bottom: 1px solid var(--accent);
      color: var(--accent-ink);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-micro);
      white-space: nowrap;
    }

    .en-note {
      display: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-label);
      text-transform: uppercase;
    }

    .wordline.is-en-hidden .word,
    .wordline.is-en-hidden .phon {
      display: none;
    }

    .wordline.is-en-hidden .en-note {
      display: inline-block;
    }

    .meaning-wrap {
      position: relative;
      margin-top: var(--space-2);
    }

    .word-row.is-masked .meaning-wrap,
    .word-row.is-revealed .meaning-wrap {
      min-height: var(--target-min);
    }

    .meanings {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1) var(--space-3);
      padding: 0;
      list-style: none;
    }

    .meaning {
      display: inline-flex;
      align-items: baseline;
      gap: var(--space-1);
      min-width: 0;
      color: var(--text-body);
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      font-weight: 400;
      line-height: var(--lh-body);
    }

    .pos {
      flex: none;
      padding: 0 var(--space-1);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xs);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-pos);
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: var(--ls-caps);
      text-transform: uppercase;
    }

    .def {
      min-width: 0;
    }

    .peek {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: var(--target-min);
      padding: 0;
      border: 0;
      border-radius: 0;
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      clip-path: inset(0 0 0 0);
      transition: clip-path var(--dur-reveal) var(--ease-out);
    }

    .peek.is-revealing {
      pointer-events: none;
      clip-path: inset(0 0 0 100%);
    }

    .peek:focus-visible {
      outline-offset: calc(var(--focus-w) * -1);
    }

    .peek-dots {
      position: absolute;
      top: 50%;
      right: 0;
      left: 0;
      height: var(--mask-h);
      background-image: radial-gradient(circle, var(--mask) 0 1px, var(--clear) 1px);
      background-position: left center;
      background-size: var(--dot-step) var(--dot-step);
      transform: translateY(-50%);
    }

    .peek-hint {
      position: relative;
      padding: 0 var(--space-2);
      background: var(--bg);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-mask);
      font-weight: 500;
      line-height: var(--lh-ui);
      letter-spacing: var(--ls-micro);
      white-space: nowrap;
      transition: color var(--dur-fast) var(--ease-out);
    }

    .peek:hover .peek-hint {
      color: var(--text);
    }

    .peek:hover .peek-dots {
      background-image: radial-gradient(circle, var(--border-strong) 0 1px, var(--clear) 1px);
    }

    .scanline {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: var(--scan-w);
      background: var(--accent);
      pointer-events: none;
      animation: scanline var(--dur-reveal) var(--ease-out) forwards;
    }

    @keyframes scanline {
      from {
        opacity: 1;
        transform: translateX(0);
      }
      to {
        opacity: 0;
        transform: translateX(var(--scan-x, 0px));
      }
    }

    /* Bottom instrument channels */
    .control-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: var(--z-bar);
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--surface);
    }

    .control-bar[hidden] {
      display: none;
    }

    .control-main {
      min-height: var(--control-h);
    }

    .channels {
      display: grid;
      min-height: var(--control-h);
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .channel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: var(--space-1);
      min-width: 0;
      min-height: var(--target-min);
      padding: var(--space-2) var(--space-2) var(--space-1);
      border: 0;
      border-top: 1px solid var(--border);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
    }

    .channel + .channel {
      border-left: 1px solid var(--border);
    }

    .channel:not(:disabled):hover {
      background: var(--surface-2);
    }

    .channel[aria-pressed="true"] {
      border-top-color: var(--accent);
    }

    .channel[aria-pressed="true"] .channel-label,
    .channel[aria-pressed="true"] .channel-value {
      color: var(--accent-ink);
    }

    .channel:disabled {
      cursor: not-allowed;
    }

    .channel:disabled .channel-label,
    .channel:disabled .channel-value {
      color: var(--text-disabled);
    }

    .channel-value {
      display: block;
      max-width: 100%;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--fs-value);
      font-weight: 600;
      line-height: var(--lh-tight);
      letter-spacing: var(--ls-num);
      font-variant-numeric: tabular-nums slashed-zero;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color var(--dur-fast) var(--ease-out);
    }

    .channel-value.is-nav {
      font-size: var(--fs-nav);
      font-weight: 400;
      letter-spacing: var(--ls-none);
    }

    .control-bar :where(button, a):focus-visible {
      outline-offset: calc(var(--focus-w) * -1);
    }

    .bar-ticks {
      height: var(--tick-area);
      border-top: 1px solid var(--border);
      background-image: linear-gradient(to right, var(--border) 0 1px, var(--clear) 1px);
      background-repeat: repeat-x;
      background-position: left top;
      background-size: var(--tick-step) var(--tick-h);
    }

    .noscript {
      padding: var(--space-6);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      letter-spacing: var(--ls-caps);
    }

    @media (max-width: 767px) {
      .hud-inner {
        padding-top: var(--space-4);
        padding-bottom: var(--space-2);
      }

      .hud-metrics {
        margin-top: var(--space-3);
      }

      .hud-progress {
        margin-top: var(--space-2);
        padding-bottom: var(--space-2);
      }

      .progress-head {
        margin-bottom: var(--space-1);
      }

      .study {
        padding-top: var(--space-3);
      }

      .study-status {
        margin-bottom: var(--space-1);
      }
    }

    @media (min-width: 768px) {
      :root {
        --start-pad: var(--space-6);
        --bar-clearance: 112px;
      }

      .hud-inner {
        padding-top: var(--space-6);
        padding-bottom: var(--space-4);
      }

      .study {
        padding-top: var(--space-6);
      }

      .start {
        min-height: calc(100svh - var(--space-12) * 2);
      }

      .control-bar {
        right: auto;
        bottom: var(--space-6);
        left: 50%;
        width: min(calc(100vw - var(--space-8) * 2), var(--bar-max));
        padding-bottom: 0;
        border: 1px solid var(--border);
        border-top: 0;
        border-radius: var(--radius-xs);
        overflow: hidden;
        transform: translateX(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --dur-fast: 0ms;
        --dur-reveal: 0ms;
        --dur-theme: 0ms;
      }

      .scanline {
        display: none;
      }
    }
  </style>
</head>
<body data-screen="study">
  <a class="skip-link" href="#main">跳到内容</a>

  <header class="hud">
    <div class="shell hud-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-copy">
          <div class="brand-line">
            <span class="brand-name">词笺</span>
            <span class="brand-rule" aria-hidden="true">──</span>
            <span class="brand-stage" id="brandStage">CET-4</span>
          </div>
          <div class="brand-sub" id="brandSub">STAGE CET-4 / 70 WORDS</div>
        </div>
      </div>
      <div class="issue">
        <span class="issue-no" id="issueNo">NO. 001</span>
        <span class="issue-batch" id="issueBatch">01/14</span>
      </div>
    </div>

    <div class="shell metrics hud-metrics" id="hudMetrics" aria-label="学习读数"></div>

    <div class="shell hud-progress" id="hudProgress">
      <div class="progress-head">
        <span>BATCH PROGRESS</span>
        <span id="progressCount">01 / 14</span>
      </div>
      <div class="ruler" id="ruler" role="progressbar" aria-label="批次进度" aria-valuemin="1" aria-valuemax="14" aria-valuenow="1">
        <span class="ruler-seg is-current"></span>
      </div>
    </div>
  </header>

  <main class="shell" id="main" tabindex="-1">
    <noscript><p class="noscript">需要启用 JavaScript 才能查看这份样张。</p></noscript>
  </main>

  <footer class="control-bar" id="controlBar" hidden>
    <div class="control-main">
      <div class="channels">
        <button class="channel" id="cnBtn" type="button" aria-pressed="true">
          <span class="channel-label">中文</span>
          <span class="channel-value">显示</span>
        </button>
        <button class="channel" id="enBtn" type="button" aria-pressed="true">
          <span class="channel-label">英文</span>
          <span class="channel-value">显示</span>
        </button>
        <button class="channel" id="prevBatchBtn" type="button" aria-label="上一批" disabled>
          <span class="channel-label">上一批</span>
          <span class="channel-value is-nav" aria-hidden="true">←</span>
        </button>
        <button class="channel" id="nextBatchBtn" type="button" aria-label="下一批">
          <span class="channel-label">下一批</span>
          <span class="channel-value is-nav" aria-hidden="true">→</span>
        </button>
      </div>
    </div>
    <div class="bar-ticks" aria-hidden="true"></div>
  </footer>

  <div class="sr-only" id="live" aria-live="polite"></div>

  <script src="./lab-data.js"></script>
  <script>
    (function () {
      "use strict";

      var data = window.LAB;
      var main = document.getElementById("main");
      var controlBar = document.getElementById("controlBar");
      var live = document.getElementById("live");
      var cnBtn = document.getElementById("cnBtn");
      var enBtn = document.getElementById("enBtn");
      var prevBatchBtn = document.getElementById("prevBatchBtn");
      var nextBatchBtn = document.getElementById("nextBatchBtn");
      var reduceQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

      if (!data || !Array.isArray(data.words) || !data.meta) {
        main.replaceChildren();
        var error = document.createElement("p");
        error.className = "noscript";
        error.textContent = "样本数据未加载。请确认 lab-data.js 与 b.html 位于同一目录。";
        main.append(error);
        return;
      }

      var meta = data.meta;
      var words = data.words;

      var REVEAL_MS = 320;
      var VALID_SCREENS = ["start", "study", "quiz"];
      var params = new URLSearchParams(window.location.search);
      var requested = params.get("s");
      var initialScreen = VALID_SCREENS.indexOf(requested) !== -1 ? requested : "study";
      var theme = params.get("t") === "dark" ? "dark" : "light";

      var state = {
        screen: initialScreen,
        current: 0,
        showChinese: initialScreen !== "quiz",
        showEnglish: true,
        peeked: initialScreen === "quiz" ? 1 : null,
        revealed: new Set(initialScreen === "quiz" ? [1] : []),
        seen: initialScreen === "quiz" ? 1 : Math.max(0, Number(meta.seen) || 0)
      };

      document.documentElement.dataset.theme = theme;
      document.body.dataset.screen = state.screen;
      if (live) {
        live.textContent = "";
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) {
          node.className = className;
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function pad(value, width) {
        var size = width || 2;
        return String(value).padStart(size, "0");
      }

      function parseMeaning(raw) {
        var text = String(raw);
        var matched = text.match(/^([A-Za-z]+\.)\s*(.*)$/);
        if (!matched) {
          return { pos: "", def: text };
        }
        return { pos: matched[1], def: matched[2] };
      }

      function announce(message) {
        if (!live) {
          return;
        }
        live.textContent = "";
        window.setTimeout(function () {
          live.textContent = message;
        }, 30);
      }

      function metricValue(label) {
        var value = el("span", "metric-value");
        if (label === "BATCH") {
          value.append(
            el("span", "num", pad(meta.batchIndex)),
            el("span", "metric-slash", "/"),
            el("span", "num", pad(meta.batchCount))
          );
        } else if (label === "WORDS") {
          value.append(el("span", "num", pad(meta.batchSize, 3)));
        } else {
          var seen = el("span", "num", pad(state.seen, 3));
          seen.dataset.seenValue = "true";
          value.append(seen);
        }
        return value;
      }

      function metricNodes() {
        return ["BATCH", "WORDS", "SEEN"].map(function (label) {
          var box = el("div", "metric");
          box.dataset.metric = label.toLowerCase();
          box.append(el("span", "metric-label", label), metricValue(label));
          return box;
        });
      }

      function renderMetrics() {
        var host = document.getElementById("hudMetrics");
        if (host) {
          host.replaceChildren.apply(host, metricNodes());
        }
      }

      function renderRuler() {
        var host = document.getElementById("hudProgress");
        if (!host) {
          return;
        }

        var head = el("div", "progress-head");
        head.append(
          el("span", null, "BATCH PROGRESS"),
          el("span", null, pad(meta.batchIndex) + " / " + pad(meta.batchCount))
        );

        var ruler = el("div", "ruler");
        ruler.id = "ruler";
        ruler.setAttribute("role", "progressbar");
        ruler.setAttribute("aria-label", "批次进度");
        ruler.setAttribute("aria-valuemin", "1");
        ruler.setAttribute("aria-valuemax", String(meta.batchCount));
        ruler.setAttribute("aria-valuenow", String(meta.batchIndex));
        ruler.setAttribute("aria-valuetext", "第 " + meta.batchIndex + " 批，共 " + meta.batchCount + " 批");

        for (var index = 1; index <= meta.batchCount; index += 1) {
          var segment = el("span", "ruler-seg");
          if (index < meta.batchIndex) {
            segment.className += " is-past";
          } else if (index === meta.batchIndex) {
            segment.className += " is-current";
          }
          segment.setAttribute("aria-hidden", "true");
          ruler.append(segment);
        }

        host.replaceChildren(head, ruler);
      }

      function updateSeen() {
        document.querySelectorAll("[data-seen-value]").forEach(function (node) {
          node.textContent = pad(state.seen, 3);
        });
      }

      function renderHud() {
        var brandStage = document.getElementById("brandStage");
        var brandSub = document.getElementById("brandSub");
        var issueNo = document.getElementById("issueNo");
        var issueBatch = document.getElementById("issueBatch");
        if (brandStage) {
          brandStage.textContent = meta.stageShort;
        }
        if (brandSub) {
          brandSub.textContent = "STAGE " + meta.stageShort + " / " + meta.total + " WORDS";
        }
        if (issueNo) {
          issueNo.textContent = meta.issue;
        }
        if (issueBatch) {
          issueBatch.textContent = pad(meta.batchIndex) + "/" + pad(meta.batchCount);
        }
        renderMetrics();
        renderRuler();
      }

      function renderStart() {
        var section = el("section", "start");
        section.setAttribute("aria-labelledby", "startTitle");

        var inner = el("div", "start-main");

        var eyebrow = el("p", "eyebrow", "BOOT CHECK · " + meta.issue);
        inner.append(eyebrow);

        var title = el("h1", "start-title");
        title.id = "startTitle";
        title.append(el("span", "title-line", meta.stage));

        var sub = el("span", "title-sub");
        sub.append(
          document.createTextNode("第 "),
          el("span", "num", pad(meta.batchIndex)),
          document.createTextNode(" 批 · 共 "),
          el("span", "num", String(meta.total)),
          document.createTextNode(" 词")
        );
        title.append(sub);
        inner.append(title);

        var metrics = el("div", "metrics start-metrics");
        metrics.setAttribute("aria-label", "本批读数");
        metrics.append.apply(metrics, metricNodes());
        inner.append(metrics);

        var lastRun = el("div", "last-run");
        lastRun.append(el("span", "last-label", "上次进度"));
        var lastValue = el("span", "last-value");
        lastValue.append(
          el("span", "num", pad(state.seen, 3)),
          el("span", "last-slash", "/"),
          el("span", "num", pad(meta.total, 3))
        );
        lastRun.append(lastValue);
        inner.append(lastRun);

        var cta = el("a", "primary");
        cta.href = "?s=study&t=" + encodeURIComponent(theme);
        cta.append(el("span", null, "开始背单词"));
        var arrow = el("span", "primary-arrow", "→");
        arrow.setAttribute("aria-hidden", "true");
        cta.append(arrow);
        inner.append(cta);

        section.append(inner);

        var foot = el("footer", "boot-foot");
        var ticks = el("div", "tick-rail");
        ticks.setAttribute("aria-hidden", "true");
        var footline = el("div", "footline");
        footline.append(
          el("span", null, meta.issue),
          el("span", null, meta.date)
        );
        foot.append(ticks, footline);
        section.append(foot);

        main.replaceChildren(section);
      }

      function makePeek(index, row, wrap, meanings) {
        var button = el("button", "peek");
        button.type = "button";
        button.setAttribute("aria-label", "揭示第 " + pad(index + 1) + " 个词 " + words[index].w + " 的中文释义");

        var dots = el("span", "peek-dots");
        dots.setAttribute("aria-hidden", "true");
        button.append(dots);

        button.addEventListener("click", function () {
          revealWord(index, button, row, wrap, meanings);
        });

        wrap.append(button);
      }

      function renderStudy() {
        var section = el("section", "study");
        section.setAttribute("aria-labelledby", "studyTitle");

        var heading = el("h1", "sr-only", meta.stage + " · 第 " + pad(meta.batchIndex) + " 批");
        heading.id = "studyTitle";
        section.append(heading);

        var status = el("div", "study-status");
        var first = (Number(meta.batchIndex) - 1) * Number(meta.batchSize) + 1;
        var last = Math.min(Number(meta.batchIndex) * Number(meta.batchSize), Number(meta.total));
        status.append(
          el("span", null, meta.stage + " · " + pad(first) + "–" + pad(last) + " / " + pad(meta.total)),
          el("span", "study-mode", state.screen === "quiz" ? "SELF CHECK" : "STUDY")
        );
        section.append(status);

        if (!state.showChinese || state.screen === "quiz") {
          section.append(el("p", "study-hint", "点按任一行 · 单独揭示该行释义"));
        }

        var list = el("ol", "word-list");
        list.setAttribute("aria-label", "本批单词");

        words.forEach(function (word, index) {
          var row = el("li", "word-row");
          row.tabIndex = -1;
          row.dataset.index = String(index);
          row.setAttribute("aria-current", index === state.current ? "true" : "false");
          if (index === state.current) {
            row.classList.add("is-current");
          }

          var masked = !state.showChinese && !state.revealed.has(index);
          if (masked) {
            row.classList.add("is-masked");
          }
          if (state.revealed.has(index)) {
            row.classList.add("is-revealed");
          }
          if (state.screen === "quiz" && state.peeked === index) {
            row.classList.add("is-peeked");
          }

          var indexCol = el("div", "index");
          indexCol.append(
            el("span", "idx-num", pad(index + 1)),
            el("span", "idx-tick")
          );

          var entry = el("div", "entry");
          var wordline = el("div", "wordline");
          if (!state.showEnglish) {
            wordline.classList.add("is-en-hidden");
          }

          var wordEl = el("h2", "word", word.w);
          wordline.append(wordEl);
          if (word.ph) {
            wordline.append(el("span", "phon", word.ph));
          }
          if (state.screen === "quiz" && state.peeked === index) {
            wordline.append(el("span", "peek-flag", "已看过"));
          }
          if (!state.showEnglish) {
            wordline.append(el("span", "en-note", "EN · HIDDEN"));
          }

          var wrap = el("div", "meaning-wrap");
          var meanings = el("ul", "meanings");
          if (masked) {
            meanings.setAttribute("aria-hidden", "true");
          }

          (word.m || []).forEach(function (raw) {
            var parsed = parseMeaning(raw);
            var item = el("li", "meaning");
            if (parsed.pos) {
              item.append(el("span", "pos", parsed.pos));
            }
            item.append(el("span", "def", parsed.def));
            meanings.append(item);
          });

          wrap.append(meanings);
          if (masked) {
            makePeek(index, row, wrap, meanings);
          }

          entry.append(wordline, wrap);
          row.append(indexCol, entry);
          list.append(row);
        });

        section.append(list);

        var end = el("div", "list-end");
        end.append(
          el("span", null, "END OF LIST"),
          el("span", null, pad(meta.batchIndex) + " / " + pad(meta.batchCount))
        );
        section.append(end);

        main.replaceChildren(section);
      }

      function renderMain() {
        document.body.dataset.screen = state.screen;
        if (state.screen === "start") {
          renderStart();
        } else {
          renderStudy();
        }
      }

      function setChannel(button, valueNode, valueText, pressed, disabled) {
        if (button) {
          button.setAttribute("aria-pressed", pressed ? "true" : "false");
          button.disabled = Boolean(disabled);
        }
        if (valueNode) {
          valueNode.textContent = valueText;
        }
      }

      function renderControls() {
        if (controlBar) {
          controlBar.hidden = state.screen === "start";
        }
        if (state.screen === "start") {
          return;
        }

        var cnValue = cnBtn.querySelector(".channel-value");
        var enValue = enBtn.querySelector(".channel-value");

        setChannel(cnBtn, cnValue, state.showChinese ? "显示" : "遮挡", state.showChinese, state.screen === "quiz");
        setChannel(enBtn, enValue, state.showEnglish ? "显示" : "遮挡", state.showEnglish, false);

        cnBtn.setAttribute("aria-label", state.screen === "quiz" ? "自测时中文释义已锁定" : (state.showChinese ? "遮挡中文释义" : "显示中文释义"));
        enBtn.setAttribute("aria-label", state.showEnglish ? "遮挡英文词形" : "显示英文词形");

        prevBatchBtn.disabled = Number(meta.batchIndex) <= 1;
        nextBatchBtn.disabled = Number(meta.batchIndex) >= Number(meta.batchCount);
      }

      function renderAll() {
        document.body.dataset.screen = state.screen;
        renderHud();
        renderMain();
        renderControls();
        var mode = state.screen === "start" ? "待开始" : state.screen === "quiz" ? "自测" : "学习";
        document.title = meta.brand + " · " + meta.stageShort + " · " + mode;
      }

      function changeBatch(delta) {
        var next = Number(meta.batchIndex) + delta;
        if (next < 1 || next > Number(meta.batchCount)) {
          return;
        }
        meta.batchIndex = next;
        state.current = 0;
        state.revealed = state.screen === "quiz" ? new Set([1]) : new Set();
        state.seen = state.screen === "quiz" ? 1 : 0;
        renderAll();
        announce("第 " + pad(next) + " 批，共 " + pad(meta.batchCount) + " 批");
      }

      function revealWord(index, button, row, wrap, meanings) {
        if (state.revealed.has(index)) {
          return;
        }

        state.revealed.add(index);
        state.seen = Math.min(meta.total, state.seen + 1);
        meanings.removeAttribute("aria-hidden");
        row.classList.add("is-revealed");
        updateSeen();

        var scan = null;
        if (!reduceQuery.matches) {
          scan = el("span", "scanline");
          scan.setAttribute("aria-hidden", "true");
          scan.style.setProperty("--scan-x", wrap.clientWidth + "px");
          wrap.append(scan);
        }

        button.classList.add("is-revealing");
        button.tabIndex = -1;
        button.setAttribute("aria-hidden", "true");
        row.focus({ preventScroll: true });

        announce("已揭示第 " + pad(index + 1) + " 个词 " + words[index].w + " 的中文释义");

        window.setTimeout(function () {
          row.classList.remove("is-masked");
          button.remove();
          if (scan) {
            scan.remove();
          }
        }, reduceQuery.matches ? 0 : REVEAL_MS);
      }

      function toggleChinese() {
        if (state.screen === "quiz") {
          return;
        }
        state.showChinese = !state.showChinese;
        state.revealed = new Set();
        renderMain();
        renderControls();
        announce(state.showChinese ? "中文释义已显示" : "中文释义已遮挡");
      }

      function toggleEnglish() {
        state.showEnglish = !state.showEnglish;
        renderMain();
        renderControls();
        announce(state.showEnglish ? "英文词形已显示" : "英文词形已遮挡");
      }

      if (prevBatchBtn) {
        prevBatchBtn.addEventListener("click", function () {
          changeBatch(-1);
        });
      }
      if (nextBatchBtn) {
        nextBatchBtn.addEventListener("click", function () {
          changeBatch(1);
        });
      }
      if (cnBtn) {
        cnBtn.addEventListener("click", toggleChinese);
      }
      if (enBtn) {
        enBtn.addEventListener("click", toggleEnglish);
      }

      renderAll();
    })();
  </script>
</body>
</html>
